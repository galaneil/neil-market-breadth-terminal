<main>
<div class="signals-shell">
  <div class="signals-rail" id="signals-rail">
    <div class="rail-h">Signal type</div>
    <div class="sig-item active" data-sig="breakout">
      <span class="sig-dot" style="background:var(--up)"></span>
      <span class="sig-label">Stage 2 breakout</span>
      <span class="sig-count" id="sig-count-breakout">0</span>
    </div>
    <div class="sig-item" data-sig="earnings">
      <span class="sig-dot" style="background:var(--warn)"></span>
      <span class="sig-label">Earnings / gap turnaround</span>
      <span class="sig-count" id="sig-count-earnings">0</span>
    </div>
    <div class="sig-item" data-sig="cup">
      <span class="sig-dot" style="background:var(--accent)"></span>
      <span class="sig-label">Cup formation</span>
      <span class="sig-count" id="sig-count-cup">0</span>
    </div>
    <div class="sig-item soon"><span class="sig-dot" style="background:var(--down)"></span>
      <span class="sig-label">Stage 4 breakdown (short)</span><span class="soon-tag">soon</span></div>

    <div class="rail-h">Filter</div>
    <div class="filter-row">
      <label>Sector</label>
      <select class="filt-select" id="sig-sector-filter"><option value="">All sectors</option></select>
    </div>
    <div class="filter-row">
      <label>Industry</label>
      <select class="filt-select" id="sig-industry-filter"><option value="">All industries</option></select>
    </div>
    <div class="filter-row">
      <label>Min % change <b id="sig-chg-val">Any</b></label>
      <input type="range" id="sig-chg-slider" min="-20" max="20" step="1" value="-20">
    </div>

    <div class="rail-h">Liquidity floor</div>
    <div class="filter-row">
      <label>Min ADR <b id="sig-adr-val">2.0%</b></label>
      <input type="range" id="sig-adr-slider" min="0" max="8" step="0.5" value="2">
    </div>
    <div class="filter-row">
      <label>Min avg turnover <b id="sig-turn-val">$20M</b></label>
      <input type="range" id="sig-turn-slider" min="0" max="200" step="10" value="20">
    </div>
    <div class="filter-row">
      <label>Min market cap <b id="sig-mcap-val">$0B</b></label>
      <input type="range" id="sig-mcap-slider" min="0" max="500" step="5" value="0">
    </div>
    <div id="sig-type-filters"></div>
  </div>
  <div class="signals-main">
    <div id="signals-head">
      <h2 id="signals-title">Stage 2 breakout</h2>
      <div class="empty-note" id="signals-sub" style="margin:4px 0 0"></div>
    </div>
    <input class="industry-search" id="sig-search" placeholder="Search by ticker…" autocomplete="off"
      style="width:220px;margin:10px 0 0">
    <!-- Last 5 trading sessions, oldest to newest left to right, today on the
         right — click one or more to filter the feed to just those days;
         nothing selected (the default) shows everything in the window. This
         is what "This week's list" used to be a separate page for; folding
         it into the feed itself means a day is a FILTER, not a different
         view to switch to and back from. -->
    <div class="sig-daystrip" id="sig-daystrip"></div>
    <div class="dim" id="signals-count" style="margin:10px 0"></div>
    <div class="sig-feed" id="signals-feed"></div>
  </div>
</div>
<div class="stock-pin" id="stock-pin">
  <div class="stock-pin-head">
    <div class="stock-pin-title"><img class="stock-pin-logo" id="pin-logo" alt=""
      onerror="this.style.visibility='hidden'"><b id="pin-symbol"></b> <span id="pin-name"></span></div>
    <button class="stock-pin-close" id="pin-close" aria-label="Close">&times;</button>
  </div>
  <div class="stock-pin-body">
    <span class="stock-pin-price" id="pin-price"></span><span class="stock-pin-chg" id="pin-chg"></span>
    <span class="stock-pin-stage" id="pin-stage"></span>
    <div class="stock-pin-verdict" id="pin-verdict"></div>
    <div class="stock-pin-stats" id="pin-stats"></div>
    <div class="lw-chart" id="pin-chart" style="flex:1 1 auto; min-height:80px; margin-top:10px"></div>
  </div>
  <div class="stock-pin-foot">Pinned here — keeps the drill open behind it. <a href="#" id="pin-open">Open full Stock Lookup &rarr;</a></div>
</div>
