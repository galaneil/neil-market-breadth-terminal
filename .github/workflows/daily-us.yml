name: Daily US market breadth refresh

on:
  schedule:
    # 23:00 UTC on weekdays. Cron is UTC-only and has no idea about US DST,
    # so this has to clear the close in BOTH halves of the year: the cash
    # session ends at 20:00 UTC under EDT and 21:00 UTC under EST. 23:00 UTC
    # is 7pm ET in summer and 6pm ET in winter, comfortably clear of both.
    # (An earlier 21:00 UTC schedule landed exactly on the closing bell every
    # winter, which risked ingesting an unfinished session.)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand runs/testing

concurrency:
  # Only one US refresh at a time — a manual dispatch landing on top of the
  # scheduled run would otherwise race to commit/push against itself.
  group: daily-refresh-us
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The per-ticker chart files hold history back to 2020, fetched once in
      # bulk. They are gitignored in main and live only on gh-pages, so a fresh
      # runner starts without them — and the nightly price source returns a
      # much shallower window. Without this restore, store.write_ticker_ohlc
      # would merge into nothing and each night would quietly truncate the
      # charts back to whatever the daily fetch happened to return. Restoring
      # BOTH countries' ticker dirs here (not just US) is deliberate: the
      # gh-pages publish step below replaces the whole site wholesale, so
      # India's tickers need to already be in docs/in/tickers before that
      # happens or this run would silently wipe them off the published site.
      - name: Restore deep ticker history from gh-pages
        continue-on-error: true
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/site
          for dir in tickers in/tickers; do
            if [ -d "/tmp/site/$dir" ]; then
              mkdir -p "docs/$dir"
              cp -r "/tmp/site/$dir/." "docs/$dir/"
              echo "restored $(ls "docs/$dir" | wc -l) files into docs/$dir"
            fi
          done
          rm -rf /tmp/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline (US only)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/main.py US

      # Commit FIRST, pull-rebase SECOND — not the other way around. Pulling
      # with rebase while the pipeline's own output sits uncommitted in the
      # working tree is exactly what git refuses to do the moment origin has
      # moved at all since checkout: it hard-fails rather than risk clobbering
      # dirty files, which is a fatal error under this shell's default -e, not
      # a merge conflict to work through. Committing locally first gives
      # rebase a clean tree and a real commit to replay, which works whether
      # or not origin moved in the meantime. The push retry loop is the other
      # half: two country workflows committing to the same branch minutes
      # apart can each see a stale origin at push time even with the
      # reordering, so a rejected push re-pulls and retries before giving up.
      - name: Commit source data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "US daily refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
              if [ "$attempt" = 5 ]; then
                echo "::error::could not push US refresh after 5 attempts"
                exit 1
              fi
            done
          fi

      # Publishing to gh-pages happens in publish-pages.yml now, triggered by
      # this job's own push to main rather than duplicated here — one place
      # that does it, reused by every path that can update docs/ (this
      # schedule, the local refresh in scripts/run_daily_refresh.py, or an
      # ordinary commit made while working on the site).
