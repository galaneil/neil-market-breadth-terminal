name: Daily market breadth refresh

on:
  schedule:
    # 23:00 UTC on weekdays. Cron is UTC-only and has no idea about US DST,
    # so this has to clear the close in BOTH halves of the year: the cash
    # session ends at 20:00 UTC under EDT and 21:00 UTC under EST. 23:00 UTC
    # is 7pm ET in summer and 6pm ET in winter, comfortably clear of both.
    # (The previous 21:00 UTC schedule landed exactly on the closing bell
    # every winter, which risked ingesting an unfinished session.)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand runs/testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/main.py

      - name: Commit source data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # The site is published to a branch that is replaced wholesale each run
      # rather than committed into main. docs/tickers/ alone is a few thousand
      # files rewritten daily; keeping every version of those in main's history
      # would add tens of megabytes a day permanently, for data regenerated
      # from scratch anyway. Only main keeps history, and only for the source
      # and the accumulating JSONL metrics.
      - name: Publish site to gh-pages
        run: |
          cd docs
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -qb gh-pages
          git add -A
          git commit -qm "Site build: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
