name: Daily market breadth refresh

on:
  schedule:
    # 23:00 UTC on weekdays. Cron is UTC-only and has no idea about US DST,
    # so this has to clear the close in BOTH halves of the year: the cash
    # session ends at 20:00 UTC under EDT and 21:00 UTC under EST. 23:00 UTC
    # is 7pm ET in summer and 6pm ET in winter, comfortably clear of both.
    # (The previous 21:00 UTC schedule landed exactly on the closing bell
    # every winter, which risked ingesting an unfinished session.)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand runs/testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/main.py

      - name: Commit and push updated data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
