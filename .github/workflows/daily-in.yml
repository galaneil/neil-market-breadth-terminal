name: Daily India market breadth refresh

on:
  schedule:
    # 11:30 UTC on weekdays = 17:00 IST. NSE/BSE close at 15:30 IST (10:00
    # UTC) year-round — India observes no daylight saving — so this clears
    # the close with a full 1.5-hour margin for Yahoo's EOD data to actually
    # be final, without holding India's refresh back to wait on the US job's
    # own schedule the way the combined workflow used to.
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}  # manual "Run workflow" button, for on-demand runs/testing

concurrency:
  # Only one India refresh at a time — a manual dispatch landing on top of
  # the scheduled run would otherwise race to commit/push against itself.
  group: daily-refresh-in
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # See daily-us.yml for the fuller story: this used to restore from
      # gh-pages, which silently stopped ever having ticker files once
      # publishing moved to the separate publish-pages.yml. Restored from
      # data-tickers instead now — a dedicated branch that only this job and
      # daily-us.yml ever write to, published directly below.
      - name: Restore deep ticker history from data-tickers
        continue-on-error: true
        run: |
          git clone --depth 1 --branch data-tickers \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/site
          for dir in tickers in/tickers; do
            if [ -d "/tmp/site/$dir" ]; then
              mkdir -p "docs/$dir"
              cp -r "/tmp/site/$dir/." "docs/$dir/"
              echo "restored $(ls "docs/$dir" | wc -l) files into docs/$dir"
            else
              echo "::warning::docs/$dir not found on data-tickers -- starting empty, history will be shallow this run"
            fi
          done
          rm -rf /tmp/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline (India only)
        run: python src/main.py IN

      # Commit FIRST, pull-rebase SECOND — not the other way around. Pulling
      # with rebase while the pipeline's own output sits uncommitted in the
      # working tree is exactly what git refuses to do the moment origin has
      # moved at all since checkout: it hard-fails rather than risk clobbering
      # dirty files, which is a fatal error under this shell's default -e, not
      # a merge conflict to work through. That's what actually took this
      # workflow down on 2026-08-31 — the pipeline step had already run and
      # left data/docs modified before "git pull --rebase" ever touched them.
      # Committing locally first gives rebase a clean tree and a real commit
      # to replay, which works whether or not origin moved in the meantime.
      # The push retry loop is the other half of the same fix: two country
      # workflows committing to the same branch minutes apart can each see a
      # stale origin at push time even with the reordering, so a rejected
      # push re-pulls and retries a few times before giving up for real.
      - name: Commit source data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/in/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "India daily refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
              if [ "$attempt" = 5 ]; then
                echo "::error::could not push India refresh after 5 attempts"
                exit 1
              fi
            done
          fi

      # Publishing docs/**.html/css/js to gh-pages happens in
      # publish-pages.yml, triggered by this job's own push to main above.
      # Tickers publish separately, right here — see daily-us.yml for why.
      - name: Publish India tickers to data-tickers branch
        run: |
          git clone --depth 1 --branch data-tickers \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tb \
            || (mkdir -p /tmp/tb && cd /tmp/tb && git init -q && git checkout -qb data-tickers)
          cd /tmp/tb
          rm -rf in/tickers
          mkdir -p in
          cp -r "$GITHUB_WORKSPACE/docs/in/tickers" in/tickers
          # US's own tickers are left untouched — this job only ever
          # replaces its own country's subtree.
          git checkout --orphan data-tickers-fresh
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -qm "India tickers: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git branch -M data-tickers
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-tickers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify India tickers actually published
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-tickers/in/tickers/RELIANCE.json")
          if [ "$code" != "200" ]; then
            echo "::error::RELIANCE.json unreachable on data-tickers after publish (HTTP $code) — ticker publish did not take"
            exit 1
          fi
          echo "verified: RELIANCE.json reachable on data-tickers"
